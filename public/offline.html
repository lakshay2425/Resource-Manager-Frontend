<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e293b" />
    <title>Offline | ResourceHub</title>
    <meta
      name="description"
      content="This page is not available offline. Return to the ResourceHub home page."
    />
    <link rel="icon" type="image/png" href="/resourceManagerLogo.png" />
    <style>
      :root {
        color-scheme: light;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #fafaf9;
        color: #1c1917;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      main {
        max-width: 28rem;
        width: 100%;
        text-align: center;
        background: #fff;
        border: 1px solid #e7e5e4;
        border-radius: 1rem;
        padding: 2rem 1.5rem;
        box-shadow: 0 10px 30px rgba(28, 25, 23, 0.08);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0.75rem;
        border-radius: 999px;
        background: #f5f5f4;
        color: #57534e;
        font-size: 0.875rem;
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        line-height: 1.2;
      }

      p {
        margin: 0 0 1.5rem;
        color: #57534e;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        box-sizing: border-box;
        padding: 0.75rem 1rem;
        border-radius: 0.75rem;
        background: #334155;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        background: #1e293b;
      }

      small {
        display: block;
        margin-top: 1rem;
        color: #a8a29e;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">ResourceHub · Offline</div>
      <h1>Page not available offline</h1>
      <p>
        This page has not been cached yet. Go back to the home page to browse content saved
        during a previous visit.
      </p>
      <a href="/">Go to Home</a>
      <small>Reconnect to access pages that are not cached.</small>
    </main>
  </body>
</html>
